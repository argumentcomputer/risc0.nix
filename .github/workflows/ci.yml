name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and cache risc0.nix
    runs-on: warp-ubuntu-latest-x64-16x
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: argumentcomputer
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#rust-bin-risc0-latest
      - run: nix build .#cargo-risczero
      - run: nix flake check
      - run: nix fmt -- --ci
  
  test:
    name: Test template dev shell
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: argumentcomputer
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      - name: Replace risc0.nix URL with local path
        run: |
          sed -i '/risc0 = {/,/};/s|url = "github:[^"]*"|url = "path:../.."|' flake.nix
          head -n 20 flake.nix
          nix flake update risc0
        working-directory: ${{ github.workspace }}/templates/hello-world
      - run: nix develop --command bash -c "cargo run --release"
        working-directory: ${{ github.workspace }}/templates/hello-world

